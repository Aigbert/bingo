[package]
name = "bingo-plugin-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The cross-process plugin bridge for bingo: a plugin.json spawns a process that ships bingo-native tools and commands"

[lints]
workspace = true

[dependencies]
# M132: persistent plugin state uses the existing ADR-0072 shelf.
bingo-shelf.workspace = true
bingo-jsonrpc.workspace = true
bingo-process.workspace = true
# M109 (ADR-0062 §2): the same off-thread picture bound as every producer.
bingo-pictures.workspace = true
bingo-sdk.workspace = true
async-trait.workspace = true
futures.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
bingo-schema-ts.workspace = true
bingo-pictures = { workspace = true, features = ["testing"] }
bingo-sdk = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
