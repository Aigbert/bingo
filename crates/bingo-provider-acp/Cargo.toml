[package]
name = "bingo-provider-acp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Agent Client Protocol adapters as model providers"

[lints]
workspace = true

[dependencies]
bingo-jsonrpc.workspace = true
bingo-process.workspace = true
bingo-services.workspace = true
bingo-sdk.workspace = true
# ADR-0035 §2: the message types are the contract; the transport is ours. The
# schema crate alone is +5 crates where the full SDK is +27, fourteen of them a
# second async runtime whose futures are `!Send`.
agent-client-protocol-schema.workspace = true
# M39 (ADR-0036 §3): `net` for the tool bridge's unix socket and named pipe;
# the workspace default omits it, as `bingo-auth-oauth` also has to say.
tokio = { workspace = true, features = ["net"] }
tokio-util.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
schemars.workspace = true
jiff.workspace = true
# M39 (ADR-0036 §3): the MCP server half of the crate this workspace already
# pins for its MCP client. `server` brings the async-read/write transport the
# accepted stream is served over; `transport-io` is the stdio pair the plan
# names beside it.
rmcp = { workspace = true, features = ["server", "transport-io"] }
# M181: use the shared token without adding a C toolchain.
bingo-loopback.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
bingo-sdk = { workspace = true, features = ["testing"] }
tempfile.workspace = true
# M39: the bridge's tests are a real MCP client on the other end of the
# rendezvous, so what is asserted is the protocol and not our own idea of it.
rmcp = { workspace = true, features = ["client"] }

# The scripted ACP agent the contract tests drive: Rust, so CI needs no node.
[[bin]]
name = "bingo-fake-acp-agent"
path = "src/bin/fake_agent/main.rs"

[lib]
doctest = false
