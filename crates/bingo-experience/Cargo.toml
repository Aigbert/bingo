[package]
name = "bingo-experience"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Experience plugin for bingo: procedural playbooks as files, recalled by rank"

[lints]
workspace = true

[dependencies]
# M178: move existing test runtime edge here for blocking filesystem work.
tokio.workspace = true
bingo-services.workspace = true
bingo-shelf.workspace = true
bingo-sdk.workspace = true
async-trait.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# M14: an entry's frontmatter, read the way a skill's is.
serde-saphyr.workspace = true
# M14: `created` and an outcome's `at` are timestamps, and `/experience` shows an age.
jiff.workspace = true
[dev-dependencies]
bingo-sdk = { workspace = true, features = ["testing"] }
# M14: the tokenizer's contract is a property over arbitrary CJK/ASCII mixes.
proptest.workspace = true
tempfile.workspace = true

[lib]
doctest = false
