[package]
name = "bingo-context"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Context plugin for bingo: the summary compactor, instruction files, memory"

[lints]
workspace = true

[dependencies]
bingo-services.workspace = true
bingo-sdk.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
# M64 (ADR-0044): a memory file that will not parse is a library error, and
# `thiserror` is already in the workspace tree — no new dependency.
thiserror.workspace = true
# M199: a memory is dated by the local day its file was written.
jiff.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
bingo-sdk = { workspace = true, features = ["testing"] }
# M4: the summary prompt is a wire the model reads, so a wording change is a
# deliberate diff.
insta.workspace = true
# M4: "a cut never splits a tool round" is a property of every journal, not of
# the three this file writes down.
proptest.workspace = true
tempfile.workspace = true

[lib]
doctest = false
