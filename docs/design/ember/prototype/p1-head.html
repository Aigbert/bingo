<title>bingo Ember</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#f3eeea;--ground2:#ebe5e0;--card:#faf7f5;--ink:#211d19;--ink2:#5d5650;--ink3:#8b837c;--line:#e0d8d1;--line2:#d2c9c1;
  --ember:#bf5418;--glow:#f07a2a;--good:#2e8540;--bad:#b3261e;--amber:#a86800;--plan:#3367b0;
  --tbg:#f9f4f2;--tfg:#3a342e;--chrome:#ece6e2;
  --halo:rgba(240,122,42,.16);
  --shadow:0 1px 1px rgba(33,29,25,.04),0 2px 6px rgba(33,29,25,.05),0 30px 60px -30px rgba(33,29,25,.35);
  --sans:'Inter','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'PingFang SC','Noto Sans SC',monospace;
  --tmono:'Maple Mono NF','Maple Mono NF CN','Maple Mono','JetBrains Mono',ui-monospace,'PingFang SC','Noto Sans SC',monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#19171a;--ground2:#201e22;--card:#211f23;--ink:#efebe6;--ink2:#b1aba4;--ink3:#7d7770;--line:#302d32;--line2:#3c393f;
  --ember:#f3904f;--glow:#ff9b4a;--good:#7fd38a;--bad:#f0706a;--amber:#f2b84b;--plan:#8ab4f0;
  --tbg:#2c2a2e;--tfg:#e6e2dc;--chrome:#262428;
  --halo:rgba(255,155,74,.14);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.3),0 34px 70px -30px rgba(0,0,0,.8);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#19171a;--ground2:#201e22;--card:#211f23;--ink:#efebe6;--ink2:#b1aba4;--ink3:#7d7770;--line:#302d32;--line2:#3c393f;
  --ember:#f3904f;--glow:#ff9b4a;--good:#7fd38a;--bad:#f0706a;--amber:#f2b84b;--plan:#8ab4f0;
  --tbg:#2c2a2e;--tfg:#e6e2dc;--chrome:#262428;
  --halo:rgba(255,155,74,.14);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.3),0 34px 70px -30px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:72px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.7 var(--sans);font-feature-settings:"cv11","ss01";
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  padding-block:0 64px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
.wrap{max-width:1280px;margin:0 auto}
code{font:500 .86em/1 var(--mono);background:color-mix(in srgb,var(--ink) 6%,transparent);padding:.15em .38em;border-radius:5px}
kbd{font:500 11.5px/1.6 var(--mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;padding:0 6px;background:var(--card);white-space:nowrap;color:var(--ink)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  background:color-mix(in srgb,var(--ground) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.topin{display:flex;align-items:center;gap:22px;height:54px}
.brand{display:flex;align-items:center;text-decoration:none;font:700 17px/1 var(--mono);letter-spacing:-.02em}
.brand .cur{display:inline-block;width:.5em;height:1.05em;background:var(--glow);margin-left:3px;border-radius:1px;
  box-shadow:0 0 10px var(--glow);animation:blink 1.2s ease-in-out infinite}
.brand small{font:500 12px/1 var(--sans);color:var(--ink3);margin-left:12px;letter-spacing:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.top nav{display:flex;gap:4px;margin-left:auto}
.top nav a{text-decoration:none;color:var(--ink2);font-size:13.5px;padding:5px 11px;border-radius:999px;transition:background .2s,color .2s}
.top nav a:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.tbtn{font:500 13px var(--sans);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 13px;cursor:pointer;display:flex;gap:7px;align-items:center}
.tbtn:hover{border-color:var(--line2)}
.tbtn i{width:12px;height:12px;border-radius:50%;background:linear-gradient(90deg,var(--ink) 50%,transparent 50%);border:1.5px solid var(--ink)}
@media (max-width:820px){.top nav{display:none}.tbtn{margin-left:auto}}

/* hero */
.hero{position:relative;padding:72px 0 0;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font:500 12.5px/1 var(--sans);color:var(--ink2);margin:0;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.eyebrow b{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 20%,transparent)}
h1,h2,h3{font-weight:650;letter-spacing:-.025em}
h1{font-size:clamp(40px,6.6vw,84px);line-height:1.04;margin:22px 0 0;letter-spacing:-.04em}
h1 .lit{color:var(--ember)}
h1 .cur{display:inline-block;width:.09em;height:.82em;background:var(--glow);margin-left:.08em;vertical-align:-.05em;border-radius:2px;
  box-shadow:0 0 18px var(--glow),0 0 42px var(--halo);animation:blink 1.2s ease-in-out infinite}
.lede{font-size:clamp(15px,1.5vw,17.5px);line-height:1.75;max-width:40em;margin:20px auto 0;color:var(--ink2)}
.stats{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 26px;margin:22px 0 0;font-size:13px;color:var(--ink3)}
.stats b{color:var(--ink);font-weight:600;margin-right:4px}

/* stage */
.stagewrap{position:relative;margin:44px auto 0}
.stagewrap::before{content:"";position:absolute;inset:auto 6% -30px;height:240px;background:radial-gradient(50% 60% at 50% 100%,var(--halo),transparent 70%);
  filter:blur(18px);pointer-events:none;z-index:0}
.stage{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) 312px;gap:26px;align-items:start;text-align:left}
@media (max-width:1180px){.stage{grid-template-columns:minmax(0,1fr)}}
.termcol{min-width:0;position:relative}
.win{border-radius:14px;overflow:hidden;box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--tfg) 12%,transparent);background:var(--tbg)}
.bar{display:flex;align-items:center;height:34px;padding:0 14px;background:var(--chrome);border-bottom:1px solid color-mix(in srgb,var(--tfg) 8%,transparent);
  font:500 12px/1 var(--sans);color:color-mix(in srgb,var(--tfg) 55%,var(--tbg));user-select:none}
.bar .dots{display:flex;gap:7px;width:70px}
.bar .dots i{width:11px;height:11px;border-radius:50%;background:color-mix(in srgb,var(--tfg) 16%,var(--chrome))}
.bar .ttl{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sz{width:70px;text-align:right;font:500 11px/1 var(--mono);opacity:.8}
.term{background:var(--tbg);color:var(--tfg);padding:12px 14px 12px;overflow-x:auto;overflow-y:hidden;position:relative}
.term:focus{outline:none}
.win:has(.term:focus-visible){outline:2px solid var(--glow);outline-offset:3px}
.hint{position:absolute;right:14px;top:44px;z-index:2;white-space:nowrap;font:500 11.5px/1.6 var(--sans);color:var(--ink2);background:var(--card);padding:2px 10px;
  border-radius:999px;border:1px solid var(--line);pointer-events:none;opacity:0;transition:opacity .25s}
.termcol:not(:focus-within) .hint.on{opacity:1}
.scr{font-family:var(--tmono);font-size:13px;font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0;font-kerning:none;
  position:relative;width:max-content;-webkit-font-smoothing:antialiased}
.r{display:flex;height:1.45em;line-height:1.45em;white-space:pre}
.r>span{flex:none;display:block;height:100%;overflow:visible}
.r i{font-style:inherit}
.w1,.w2{display:inline-block;text-align:center;overflow:visible}
.w1{width:1ch}.w2{width:2ch}
.bx{display:block;flex:none;height:100%}
.bx.v25{background-image:linear-gradient(90deg,currentColor 25%,transparent 25%);background-size:1ch 100%;background-repeat:repeat-x}
.bx.v38{background-image:linear-gradient(90deg,currentColor 37.5%,transparent 37.5%);background-size:1ch 100%;background-repeat:repeat-x}
.bx.v50{background-image:linear-gradient(90deg,currentColor 50%,transparent 50%);background-size:1ch 100%;background-repeat:repeat-x}
.bx.r25{background-image:linear-gradient(270deg,currentColor 25%,transparent 25%);background-size:1ch 100%;background-repeat:repeat-x}
.bx.full{background-image:linear-gradient(currentColor,currentColor)}
.bx.up{background-image:linear-gradient(180deg,currentColor 50%,transparent 50%)}
.bx.dn{background-image:linear-gradient(0deg,currentColor 50%,transparent 50%)}
.bx.e8{background-image:linear-gradient(180deg,currentColor 12.5%,transparent 12.5%)}
.bx.b8{background-image:linear-gradient(0deg,currentColor 12.5%,transparent 12.5%)}
/* rules are solid boxes, not gradients: each raster tile rounds a 1px gradient band to its own row */
.bx.h,.bx.hh{position:relative}
.bx.h::before,.bx.hh::before{content:'';position:absolute;left:0;right:0;top:50%;background:currentColor}
.bx.h::before{height:1px;margin-top:-.5px}
.bx.hh::before{height:.18em;margin-top:-.09em}
.bx.vl{background-image:linear-gradient(90deg,transparent calc(50% - .5px),currentColor calc(50% - .5px),currentColor calc(50% + .5px),transparent calc(50% + .5px));background-size:1ch 100%;background-repeat:repeat-x}
.r.ck{cursor:pointer}
.r.ck:hover>span:not([style*="background"]){background:color-mix(in srgb,var(--tfg) 3.5%,transparent)}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;align-items:center}
.keys button{font:500 12px/1.5 var(--mono);padding:4px 10px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:7px;
  background:var(--card);color:var(--ink);cursor:pointer;min-width:36px;transition:background .15s,color .15s,border-color .15s}
.keys button.hit{background:var(--glow);color:#fff;border-color:var(--glow)}
.typer{flex:1 1 220px;min-width:160px;font:13px var(--mono);padding:5px 11px;border:1px solid var(--line2);border-radius:8px;background:var(--card);color:var(--ink)}
.typer:focus{outline:2px solid var(--glow);outline-offset:1px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 0;font-size:13px}
.toolbar .sep{flex:1}
.toolbar .lbl{font:600 11px/1 var(--sans);letter-spacing:.12em;color:var(--ink3);text-transform:uppercase;margin-right:2px}
.cap{margin:10px 2px 0;font:12px/1.5 var(--sans);color:var(--ink3)}
.tb{font:500 12.5px/1.6 var(--sans);padding:3px 11px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink2);cursor:pointer}
.tb:hover{border-color:var(--line2);color:var(--ink)}
.tb[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}

/* scene rail */
.rail{display:flex;flex-direction:column;gap:14px}
.notes{border:1px solid var(--line);border-radius:16px;padding:18px 20px 16px;background:var(--card);font-size:13.5px;line-height:1.7}
.notes .nk{display:flex;justify-content:space-between;font:500 11.5px/1 var(--mono);color:var(--ink3);margin:0 0 8px;letter-spacing:.02em}
.notes h3{font-size:21px;margin:0 0 8px;line-height:1.3}
.notes .what{margin:0;color:var(--ink2)}
.notes h4{font:600 11px/1 var(--sans);letter-spacing:.12em;color:var(--ink3);margin:16px 0 8px;text-transform:uppercase}
.notes ul{margin:0;padding-left:1.05em}
.notes li{margin:4px 0}
.notes li::marker{color:var(--ink3)}
.nav2{display:flex;gap:8px}
.nav2 button{flex:1;font:500 12.5px var(--sans);padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink2);cursor:pointer}
.nav2 button:hover{color:var(--ink);border-color:var(--line2)}
.chips{display:flex;flex-direction:column;gap:12px;margin:22px 0 0;text-align:left}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grp>span{font:600 11px/1 var(--sans);letter-spacing:.12em;color:var(--ink3);width:52px;text-transform:uppercase}
.chip{font:500 13px/1.5 var(--sans);padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink2);cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;transition:border-color .15s,color .15s,background .15s}
.chip em{font:500 10.5px/1 var(--mono);font-style:normal;color:var(--ink3)}
.chip:hover{border-color:var(--line2);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip[aria-pressed="true"] em{color:color-mix(in srgb,var(--ground) 60%,var(--ink))}

/* sections */
section{padding:96px 0 0}
.shead{max-width:760px;margin:0 0 34px}
.shead .num{font:600 12px/1 var(--mono);color:var(--ember);margin:0 0 14px;letter-spacing:.06em}
.shead h2{font-size:clamp(30px,3.8vw,46px);line-height:1.12;margin:0}
.shead p{margin:16px 0 0;color:var(--ink2);font-size:16px}
h3{font-size:20px;line-height:1.35;margin:0 0 8px}

/* gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(282px,1fr));gap:18px}
.card{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit;
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--line2)}
.card .shot{background:var(--tbg);padding:9px 10px;overflow:hidden;border-bottom:1px solid var(--line);height:auto}
.card .shot .scr{font-size:5.4px}
.card .meta{padding:12px 15px 14px}
.card .meta b{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:14.5px}
.card .meta b em{font:500 11px/1 var(--mono);font-style:normal;color:var(--ink3)}
.card .meta span{display:block;color:var(--ink2);font-size:13px;line-height:1.55;margin-top:4px}

/* design language */
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.pillar{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:20px 20px 18px}
.pillar .k{display:inline-block;font:600 11px/1 var(--sans);letter-spacing:.1em;color:var(--ember);margin-bottom:12px}
.pillar h3{font-size:19px}
.pillar p{margin:0;color:var(--ink2);font-size:14px}
.sub{margin:72px 0 18px;max-width:760px}
.sub h3{font-size:24px;margin:0}
.sub p{margin:8px 0 0;color:var(--ink2)}
.anat{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:28px;align-items:start}
@media (max-width:1100px){.anat{grid-template-columns:minmax(0,1fr)}}
.anat .win .term{padding:12px 14px 12px 34px}
.callouts{list-style:none;margin:0;padding:0;counter-reset:c;display:flex;flex-direction:column;gap:10px}
.callouts li{counter-increment:c;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;font-size:14px;line-height:1.6}
.callouts li::before{content:counter(c);display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--ground);font:600 11.5px/1 var(--mono);margin-top:1px}
.callouts li b{font-weight:600}
.callouts li span{color:var(--ink2);display:block}
.pin{position:absolute;z-index:3;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--ground);font:600 11px/20px var(--mono);text-align:center;
  box-shadow:0 0 0 3px var(--tbg);pointer-events:none;transform:translate(-50%,-50%)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font:600 11px/1.4 var(--sans);letter-spacing:.1em;color:var(--ink3);text-transform:uppercase;background:color-mix(in srgb,var(--ink) 2.5%,transparent)}
td.g{font:15px/1.4 var(--tmono);white-space:nowrap}
td.g span{display:inline-flex;justify-content:center;min-width:2.1em;background:var(--tbg);border-radius:6px;padding:2px 7px;margin-right:6px;border:1px solid color-mix(in srgb,var(--tfg) 8%,transparent)}
td.mini{width:210px}
td.mini .scr{font-size:13px;background:var(--tbg);padding:3px 9px;border-radius:7px;display:inline-block;border:1px solid color-mix(in srgb,var(--tfg) 8%,transparent)}
td code{white-space:nowrap}
.inks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ink{border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:12.5px;background:var(--card)}
.ink .pair{display:flex;height:58px}
.ink .pair span{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:7px 9px;font:11px/1.2 var(--tmono)}
.ink .pair span b{font-size:16px;font-weight:700}
.ink .meta{padding:8px 11px 10px;line-height:1.5}
.ink .meta b{font:600 12px var(--mono)}
.ink .meta span{color:var(--ink2);display:block}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.rule{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:baseline;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.rule kbd{grid-row:span 2;font-size:12.5px;padding:2px 9px;align-self:start}
.rule b{font-weight:600;font-size:14.5px}
.rule span{color:var(--ink2);font-size:13.5px}

/* compare */
.pairbox{margin:0 0 64px}
.pairbox h3{margin:0 0 4px;font-size:22px}
.pairbox .why{margin:0 0 16px;color:var(--ink2)}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:960px){.duo{grid-template-columns:minmax(0,1fr)}}
figure{margin:0;min-width:0}
figcaption{display:flex;align-items:center;gap:8px;font:600 11px/1 var(--sans);letter-spacing:.1em;color:var(--ink3);margin:0 0 10px;text-transform:uppercase}
figcaption i{width:8px;height:8px;border-radius:50%;background:var(--ink3)}
figcaption.new i{background:var(--glow);box-shadow:0 0 8px var(--glow)}
.before img{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block;background:var(--tbg)}
.duo .win{border-radius:12px}
.duo .term{padding:9px 11px}
.diffs{margin:16px 0 0;padding-left:1.1em;font-size:14px;max-width:64em;color:var(--ink2)}
.diffs li{margin:4px 0}
.diffs li b{color:var(--ink);font-weight:600}

/* plan */
.plan{display:grid;gap:12px}
.ms{display:grid;grid-template-columns:110px minmax(0,1fr) 220px;gap:6px 22px;padding:18px 20px;border:1px solid var(--line);border-radius:14px;background:var(--card);align-items:start}
@media (max-width:860px){.ms{grid-template-columns:minmax(0,1fr)}}
.ms .id{font:600 13px/1.5 var(--mono);color:var(--ember)}
.ms .id small{display:block;font:500 11.5px/1.5 var(--sans);color:var(--ink3)}
.ms h3{font-size:16.5px;margin:0 0 4px}
.ms p{margin:0;color:var(--ink2);font-size:14px}
.ms .files{font:12px/1.65 var(--mono);color:var(--ink3)}
.asks{counter-reset:d;list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.asks li{counter-increment:d;border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--card);font-size:14px}
.asks li::before{content:counter(d);display:inline-grid;place-items:center;font:600 11.5px/1 var(--mono);color:var(--ground);background:var(--ember);border-radius:999px;width:22px;height:22px;margin-right:10px}
.asks li b{font-weight:600}
.asks li p{margin:8px 0 0;color:var(--ink2)}
